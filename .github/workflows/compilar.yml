name: Compilar IPA

on:
  workflow_dispatch:   # se ejecuta a mano desde la pestaña Actions
  push:
    branches: [main]

jobs:
  compilar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar sin firmar
        run: |
          xcodebuild -project MouseIphone.xcodeproj \
            -scheme MouseIphone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Armar el .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MouseIphone.app Payload/
          zip -r MouseIphone.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MouseIphone-ipa
          path: MouseIphone.ipa
